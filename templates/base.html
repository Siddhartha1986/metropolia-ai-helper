<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <!-- Page title (dynamic for each page) -->
    <title>{% block title %}Metropolia Nursing AI Helper{% endblock %}</title>

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >

    <!-- Global page styling -->
    <style>
      body {
        background-color: #f5f5f5;
      }
      .navbar-brand {
        font-weight: 600;
      }
      .page-wrapper {
        padding-top: 2rem;
        padding-bottom: 2rem;
      }
      .card {
        border-radius: 0.75rem;
      }
      footer {
        font-size: 0.8rem;
        color: #777;
        margin-top: 2rem;
        text-align: center;
      }

      /* ---- Extra styling for the front page ---- */

      /* Main title on the front page */
      .hero-title {
        font-weight: 700;
        font-size: 2.1rem;
      }

      /* Subtitle under the main title */
      .hero-subtitle {
        color: #6c757d; /* Bootstrap muted grey */
        font-size: 0.98rem;
      }

      /* Feature cards (Nursing terms / Summarizer) */
      .feature-card {
        border-radius: 1rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      /* Light hover “lift” effect for cards */
      .feature-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.08);
      }

      /* Icon circle in feature cards */
      .feature-icon {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
      }

      .feature-icon-left {
        background-color: rgba(13, 110, 253, 0.1);  /* blue tint */
        color: #0d6efd;
      }

      .feature-icon-right {
        background-color: rgba(220, 53, 69, 0.08);  /* red tint */
        color: #dc3545;
      }
    </style>

  </head>

  <body>
    <!-- =====================================================
         NAVBAR (shown on ALL pages)
         ===================================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">

        <!-- Left side brand link -->
        <a class="navbar-brand" href="{{ url_for('index') }}">
          Metropolia AI Helper
        </a>

        <!-- Mobile menu toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible navbar links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            
            <!-- Nursing Terms link (highlighted when active) -->
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'nurse_helper' %}active{% endif %}"
                 href="{{ url_for('nurse_helper') }}">
                Nursing terms
              </a>
            </li>

            <!-- Summarizer link (highlighted when active) -->
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'summarize' %}active{% endif %}"
                 href="{{ url_for('summarize') }}">
                Summarizer
              </a>
            </li>

          </ul>
        </div>
      </div>
    </nav>

    <!-- =====================================================
         MAIN PAGE CONTENT (this changes for each route)
         ===================================================== -->
    <div class="container page-wrapper">
      {% block content %}
      {% endblock %}

      <!-- Page footer -->
      <footer>
        Metropolia Nursing AI Helper – demo by Siddhartha Lama
      </footer>
    </div>

    <!-- Bootstrap JS for navbar toggle on small screens -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous">
    </script>
  </body>
</html>
